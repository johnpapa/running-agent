<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Running Agent - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 500px;
    }

    .login-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .login-header {
      background: #fc4c02;
      color: white;
      padding: 40px 30px;
      text-align: center;
    }

    .login-header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 16px;
      opacity: 0.95;
    }

    .login-content {
      padding: 40px 30px;
    }

    .strava-login-btn {
      width: 100%;
      background: #fc4c02;
      color: white;
      border: none;
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s;
    }

    .strava-login-btn:hover {
      background: #e63c00;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(252, 76, 2, 0.3);
    }

    .strava-login-btn svg {
      width: 24px;
      height: 24px;
    }

    @media (max-width: 428px) {
      .login-header {
        padding: 30px 20px;
      }

      .login-header h1 {
        font-size: 28px;
      }

      .login-header p {
        font-size: 14px;
      }

      .login-content {
        padding: 30px 20px;
      }

      .strava-login-btn {
        font-size: 16px;
        padding: 14px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>Running Agent</h1>
        <p>Track your running activities and best times with Strava</p>
      </div>

      <div class="login-content">
        <button class="strava-login-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.169"/>
          </svg>
          Connect with Strava
        </button>
      </div>
    </div>
  </div>
</body>
</html>
